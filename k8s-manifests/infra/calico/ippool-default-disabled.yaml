# Vo hieu hoa pool cu 192.168.0.0/16 (KHONG xoa).
# Pod cu van giu IP cho den khi bi thay the; pod moi chi lay tu pods-10-244.
apiVersion: projectcalico.org/v3
kind: IPPool
metadata:
  name: default-ipv4-ippool
spec:
  cidr: 192.168.0.0/16
  disabled: true
  blockSize: 26
  ipipMode: Never
  vxlanMode: CrossSubnet
  natOutgoing: true
  nodeSelector: all()
