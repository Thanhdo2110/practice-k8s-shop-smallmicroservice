apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: product-service-networkpolicy
  namespace: shop-k8s
spec:
  podSelector:
    matchLabels:
      run: product-service

  policyTypes:
  - Ingress
  - Egress

  ingress:
  # 1) ingress-nginx -> API tu ben ngoai
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: ingress-nginx
    ports:
    - protocol: TCP
      port: 8001

  # 2) order-service goi sang de lay thong tin san pham (app/catalog_client.py)
  - from:
    - podSelector:
        matchLabels:
          run: order-service
    ports:
    - protocol: TCP
      port: 8001

  # 3) kubelet probe tu node
  - from:
    - ipBlock:
        cidr: 192.168.0.0/24
    ports:
    - protocol: TCP
      port: 8001

  egress:
  # DNS (UDP + TCP 53)
  - to:
    - namespaceSelector: {}
      podSelector:
        matchLabels:
          k8s-app: kube-dns
    ports:
    - protocol: UDP
      port: 53
    - protocol: TCP
      port: 53

  # MySQL tren Azure
  - to:
    - ipBlock:
        cidr: 74.151.142.190/32 # ip cua database tren Azure
    ports:
    - protocol: TCP
      port: 3306
