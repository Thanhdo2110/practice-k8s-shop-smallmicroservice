apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-service-configmap
  namespace: shop-k8s
data:
  HOST: "0.0.0.0"
  PORT: "8000"
  SERVICE_NAME: "auth-service"
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "INFO"

 
  JWT_ISSUER: "shop"
  JWT_EXPIRE_SECONDS: "86400"

  CORS_ORIGINS:  "http://localhost:5173,http://localhost:3000"