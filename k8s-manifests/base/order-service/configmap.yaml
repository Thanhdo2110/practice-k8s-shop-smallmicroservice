apiVersion: v1
kind: ConfigMap
metadata:
  name: order-service-configmap
  namespace: shop-k8s
data:
  HOST: "0.0.0.0"
  PORT: "8002"
  SERVICE_NAME: "order-service"
  APP_VERSION: "1.0.0"
  LOG_LEVEL: "INFO"

 
  JWT_ISSUER: "shop"
  JWT_EXPIRE_SECONDS: "86400"

  CORS_ORIGINS:  "http://localhost:5173,http://localhost:3000"

  # FIX: order-service goi product-service qua HTTP (app/catalog_client.py).
  # Trong pod, 127.0.0.1:8001 la chinh container order-service -> connection refused.
  # Phai dung ten Service trong cluster (Service product-service-svc, targetPort 8001).
  PRODUCT_SERVICE_BASE_URL: "http://product-service-svc:80"
  PRODUCT_SERVICE_TIMEOUT: "3"
  MYSQL_SSL_CA: "/etc/mysql/certs/DigiCertGlobalRootG2.crt.pem"