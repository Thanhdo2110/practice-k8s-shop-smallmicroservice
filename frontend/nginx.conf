# nginx config cho React SPA (frontendthk8s)
# Copy vao /etc/nginx/conf.d/default.conf trong Dockerfile.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Probe endpoint rieng: khong ghi access log, khong phu thuoc file tinh
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Asset do Vite build ra co hash trong ten -> cache vinh vien
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Moi file khac khong can cache manh (de thay ban moi ngay sau deploy)
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # FIX SPA: F5 o /products/123 hay /cart ... khong con 404
    # Khong tim thay file tren disk -> tra index.html de React Router xu ly
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
}
